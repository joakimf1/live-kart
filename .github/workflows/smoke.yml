name: Røyktest

# Kjøres bare manuelt: Actions → Røyktest → Run workflow.
# (Automatiske kjøringer ved opplasting og hver morgen er slått av.)
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enhetstester for push-Worker
        run: node worker/test.mjs

      - name: Installer Playwright
        working-directory: tests
        run: |
          npm init -y > /dev/null
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Start lokal server
        run: python3 -m http.server 8000 &

      - name: Kjør røyktest
        working-directory: tests
        env:
          BASE_URL: http://localhost:8000/
        run: node smoke.mjs

      - name: Last opp skjermbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skjermbilder
          path: tests/shots
          retention-days: 7
